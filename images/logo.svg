<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" width="100%" height="100%">
  <!-- Blue Heart -->
  <path d="M 60 88 C 60 88 18 57 18 35 C 18 19 30 10 43 10 C 52 10 60 17 60 17 C 60 17 68 10 77 10 C 90 10 102 19 102 35 C 102 57 60 88 60 88 Z" fill="#008cd6" />
  
  <!-- Red pulse line outside the heart -->
  <path d="M 8 60 L 35 60" stroke="#e92330" stroke-width="5" stroke-linecap="round" fill="none" />
  <path d="M 85 60 L 112 60" stroke="#e92330" stroke-width="5" stroke-linecap="round" fill="none" />
  
  <!-- White ECG pulse line crossing through the heart -->
  <path d="M 35 60 L 40 60 L 46 72 L 53 22 L 60 92 L 67 42 L 73 70 L 78 60 L 85 60" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" fill="none" />

  <!-- Typography -->
  <text x="125" y="48" font-family="'Outfit', 'Plus Jakarta Sans', 'Inter', sans-serif" font-size="34" font-weight="900" fill="#008cd6" letter-spacing="1">GENESIS</text>
  <text x="128" y="78" font-family="'Outfit', 'Plus Jakarta Sans', 'Inter', sans-serif" font-size="22" font-weight="500" fill="#7f7f7f" letter-spacing="8.5">TRADING</text>
</svg>
